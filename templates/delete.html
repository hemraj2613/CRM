{% extends "base.html" %}

{% block title %}Delete Order{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

        <div class="card shadow-lg border-0 rounded-4">
            
            <!-- Header -->
            <div class="card-header bg-danger text-white text-center py-4 rounded-top-4">
                <div class="mb-2">
                    <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                </div>
                <h3 class="mb-0 fw-bold">Delete Order</h3>
            </div>

            <!-- Body -->
            <div class="card-body text-center p-4">

                <h5 class="fw-semibold mb-3">
                    Are you sure you want to delete this order?
                </h5>

                <div class="alert alert-warning border-0 rounded-3">
                    <strong>Order:</strong> {{ item }}
                </div>

                <p class="text-muted mb-4">
                    This action cannot be undone. Once deleted, this order
                    will be permanently removed.
                </p>

                <!-- Buttons -->
                <form action="{% url 'delete_order' item.id %}" method="post">
                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-2">

                        <a href="{% url 'home' %}"
                           class="btn btn-secondary px-4">
                            <i class="bi bi-arrow-left me-1"></i>
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-danger px-4">
                            <i class="bi bi-trash me-1"></i>
                            Delete
                        </button>

                    </div>
                </form>

            </div>
        </div>

    </div>
</div>


</div>

{% endblock %}
